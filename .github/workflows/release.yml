name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build with CMake (Release)
        run: cmake --build build --config Release --parallel

      - name: Prepare Package and Zip
        shell: pwsh
        run: |
          $stagingDir = "staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          # 빌드 산출물 복사
          Copy-Item "build\proxy-asio\Release\ProxyAsio64.dll" "$stagingDir\" -Force
          Copy-Item "build\obs-plugin\Release\obs-asio-splitter.dll" "$stagingDir\" -Force
          Copy-Item "build\tray\Release\AsioSplitterTray.exe" "$stagingDir\" -Force

          # 설치 및 안내 스크립트 복사
          Copy-Item "install.cmd" "$stagingDir\" -Force
          Copy-Item "install.ps1" "$stagingDir\" -Force
          Copy-Item "uninstall.cmd" "$stagingDir\" -Force
          Copy-Item "uninstall.ps1" "$stagingDir\" -Force
          Copy-Item "README.md" "$stagingDir\" -Force
          Copy-Item "INSTALL.md" "$stagingDir\" -Force

          # 패키지 및 압축 파일 이름 결정
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v[0-9]') {
              $packageName = "asio-obs-splitter-$refName"
          } else {
              $packageName = "asio-obs-splitter-windows-x64"
          }
          $zipName = "$packageName.zip"

          # GitHub Release용 단일 ZIP 생성
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName"

          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      # GitHub Actions Run 요약 페이지에서 다운로드하는 Artifact
      # 폴더(staging/)를 지정하면 GitHub가 이를 zip으로 다운로드하므로 이중 압축(zip in zip)이 방지됩니다.
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: staging/
          if-no-files-found: error

      # GitHub Releases 태그 배포 시 첨부되는 사전 압축 ZIP 파일
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
